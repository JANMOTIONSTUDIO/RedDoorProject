<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Behind the Red Door</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Spectral:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --limewash: #ece5d8;
      --door: #a8161d;
      --door-deep: #7d0f14;
      --soot: #1b1611;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    /* No page background once the camera is running: it would paint over the camera video */
    html { background: var(--soot); }
    html.ar-running, html.ar-running body { background: transparent; }
    body { font-family: "Spectral", Georgia, serif; color: var(--limewash); }

    #intro {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: calc(2rem + env(safe-area-inset-top, 0px)) 1.75rem calc(2.5rem + env(safe-area-inset-bottom, 0px));
      background:
        linear-gradient(to bottom, rgba(27,22,17,0.15), rgba(27,22,17,0.92) 60%),
        url("painting-target.jpg") center / cover no-repeat;
    }
    #intro h1 {
      font-family: "IM Fell English", Georgia, serif; font-weight: 400;
      font-size: clamp(2.6rem, 11vw, 4.2rem); line-height: 1; margin: 0 0 0.6rem;
    }
    #intro p { margin: 0 0 1.75rem; max-width: 32ch; line-height: 1.55; font-size: 1.05rem; opacity: 0.9; }
    #intro .date { font-family: "IM Fell English", Georgia, serif; font-style: italic; font-size: 1.25rem; margin-bottom: 1rem; opacity: 1; }

    .door-button {
      font: 500 1.1rem "Spectral", Georgia, serif;
      color: var(--limewash); background: var(--door);
      border: 0; border-left: 6px solid var(--door-deep);
      padding: 0.9rem 2.2rem; cursor: pointer;
    }
    .door-button:focus-visible { outline: 3px solid var(--limewash); outline-offset: 3px; }
    .door-button[disabled] { opacity: 0.6; }
    #start { align-self: flex-start; }
    #knock {
      position: fixed; left: 50%; transform: translateX(-50%); z-index: 6;
      bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
      font-size: 1.25rem; padding: 1rem 2.8rem;
    }

    #hint, #error {
      position: fixed; left: 50%; transform: translateX(-50%); z-index: 5;
      bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
      width: min(88vw, 26rem); text-align: center;
      background: rgba(27,22,17,0.82); padding: 0.8rem 1rem; line-height: 1.45;
    }
    #error { display: none; border-left: 6px solid var(--door); text-align: left; }
    #caption {
      position: fixed; left: 50%; transform: translateX(-50%); z-index: 5;
      top: calc(1rem + env(safe-area-inset-top, 0px));
      width: min(88vw, 26rem); text-align: center; font-style: italic;
      background: rgba(27,22,17,0.75); padding: 0.5rem 0.9rem; line-height: 1.4; font-size: 0.95rem;
    }
    #music-btn {
      position: fixed; z-index: 6;
      right: calc(1rem + env(safe-area-inset-right, 0px));
      bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
      font-size: 1rem; padding: 0.7rem 1.2rem;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <section id="intro">
    <p class="date">Census night, 18 April 1926</p>
    <h1>Behind the Red Door</h1>
    <p>Point your camera at the painting, then knock to step inside.</p>
    <button id="start" class="door-button" type="button">Open camera</button>
  </section>

  <div id="hint" class="hidden">Point your camera at the painting</div>
  <button id="knock" class="door-button hidden" type="button">Knock</button>
  <div id="error" role="alert"></div>
  <div id="caption" class="hidden">Music generated with AI, 2026</div>
  <button id="music-btn" class="door-button hidden" type="button">Play music</button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no; uiLoading: yes; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001"
    renderer="colorManagement: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="20000">
      <a-asset-item id="grandmother-model" src="./grandmother.glb"></a-asset-item>
      <a-asset-item id="fireplace-model" src="./fireplace.glb"></a-asset-item>
      <a-asset-item id="radio-model" src="./radio.glb"></a-asset-item>
      <a-asset-item id="book-model" src="./book.glb"></a-asset-item>
      <a-asset-item id="window-model" src="./window.glb"></a-asset-item>
      <a-asset-item id="table-model" src="./table.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!--
      Coordinates: the painting is 1 unit wide and 0.823 tall, centred on 0 0 0.
      +x right, +y up, +z out of the painting towards the viewer.
      The room sits behind the painting (negative z) and is only seen through the painting's outline.
    -->
    <a-entity mindar-image-target="targetIndex: 0" story>

      <!-- Invisible "wall" around the painting: hides any part of the room outside the canvas edges -->
      <a-plane occluder position="0 2.9113 0"  width="10" height="5"></a-plane>
      <a-plane occluder position="0 -2.9113 0" width="10" height="5"></a-plane>
      <a-plane occluder position="-3 0 0" width="5" height="0.8226"></a-plane>
      <a-plane occluder position="3 0 0"  width="5" height="0.8226"></a-plane>

      <!-- A copy of the painting laid over the real one. This is what dissolves. -->
      <a-plane id="painting-skin" width="1" height="0.8226" position="0 0 0.001"
               dissolve="src: painting-target.jpg; progress: 0" visible="false"></a-plane>

      <!-- The room -->
      <a-entity id="room">
        <a-entity light="type: hemisphere; color: #ffe9cc; groundColor: #3b2c1e; intensity: 0.7"></a-entity>
        <a-entity light="type: point; color: #ff9a4a; intensity: 1.6; distance: 2.2; decay: 1" position="0.44 -0.42 -1.05" flicker="base: 1.6; amount: 0.35"></a-entity>
        <a-entity light="type: directional; color: #fff4e0; intensity: 0.5" position="-0.4 0.6 0.8"></a-entity>

        <!-- floor, walls, ceiling -->
        <a-plane position="0 -0.5 -0.7" rotation="-90 0 0" width="1.8" height="1.4" material="color: #4b4239; roughness: 1"></a-plane>
        <a-plane position="0 0.125 -1.4" width="1.8" height="1.25" material="color: #e2dbcd; roughness: 1"></a-plane>
        <a-plane position="-0.9 0.125 -0.7" rotation="0 90 0" width="1.4" height="1.25" material="color: #cfc3ae; roughness: 1"></a-plane>
        <a-plane position="0.9 0.125 -0.7" rotation="0 -90 0" width="1.4" height="1.25" material="color: #cfc3ae; roughness: 1"></a-plane>
        <a-plane position="0 0.75 -0.7" rotation="90 0 0" width="1.8" height="1.4" material="color: #2f251b; roughness: 1"></a-plane>
        <a-box position="0 0.72 -0.35" width="1.8" height="0.05" depth="0.07" material="color: #241a12"></a-box>
        <a-box position="0 0.72 -0.95" width="1.8" height="0.05" depth="0.07" material="color: #241a12"></a-box>

        <!-- Fireplace (your model). Built in metres, so it uses the room scale of 0.32.
             It stands on the floor against the back wall, to the right of centre. -->
        <a-entity id="fireplace" gltf-model="#fireplace-model"
                  position="0.45 -0.196 -1.238" scale="0.32 0.32 0.32"></a-entity>

        <!-- Sacred Heart picture and red lamp, above the fireplace -->
        <a-box position="0.45 0.36 -1.39" width="0.14" height="0.18" depth="0.015" material="color: #3a2616"></a-box>
        <a-plane position="0.45 0.36 -1.381" width="0.11" height="0.15" material="color: #6e2a22; shader: flat"></a-plane>
        <a-sphere position="0.45 0.235 -1.37" radius="0.012" material="color: #ff2a2a; emissive: #ff0000; emissiveIntensity: 1.5"></a-sphere>
        <a-entity light="type: point; color: #ff3030; intensity: 0.25; distance: 0.4" position="0.45 0.235 -1.3"></a-entity>

        <!-- Window (your model) set into the back wall, standing a little proud of it so it reads clearly.
             Sill about 0.9 m from the floor. Behind the panes, an evening sky; cool light comes in. -->
        <a-plane position="-0.45 0.04 -1.36" width="0.42" height="0.56"
                 material="shader: flat; color: #a7bccf"></a-plane>
        <a-entity id="window" gltf-model="#window-model"
                  position="-0.45 0.048 -1.515" scale="0.4 0.4 0.4"></a-entity>
        <a-entity light="type: directional; color: #cfe0ff; intensity: 0.5" position="-0.45 0.35 -1.8"></a-entity>

        <!-- Table (your 1926 model), about 1.2 m long and 72 cm high, brought forward into the room
             on the left, clear of her path. -->
        <a-entity id="table" gltf-model="#table-model"
                  position="-0.55 -0.332 -0.75" scale="0.208 0.208 0.208"></a-entity>

        <!-- Gramophone on the left end of the table, beside the vase, turned towards the room.
             The invisible box around it makes it easier to tap. -->
        <a-entity id="radio" position="-0.66 -0.2 -0.74" rotation="0 25 0">
          <a-entity gltf-model="#radio-model" scale="0.0736 0.0736 0.0736"></a-entity>
          <a-box class="clickable" radio-tap width="0.22" height="0.2" depth="0.22" position="0 0.01 0"
                 material="opacity: 0; transparent: true; depthWrite: false"></a-box>
        </a-entity>

        <!-- Your grandmother and her chair, in her own scale (1 unit = 1 metre for her).
             The group is shrunk so she stands about two-thirds the height of the painting. -->
        <a-entity id="stage" position="-0.2 -0.5 -1.0" scale="0.32 0.32 0.32">
          <a-entity id="grandmother"
                    gltf-model="#grandmother-model"
                    play-clip="clip: Walk_to_Sit"
                    visible="false"></a-entity>

          <!-- The book (Irish Idylls), propped up by her right foot with its cover facing the viewer.
               It fades in once she has sat down. -->
          <a-entity id="book" position="1.0 0 1.9" rotation="0 -20 0" visible="false">
            <a-entity gltf-model="#book-model" position="0 0.118 0" rotation="80 0 0" scale="0.24 0.24 0.24"></a-entity>
          </a-entity>

          <!-- Súgán-style chair where the animation sits her down.
               If she sits too high or low, change the y of #chair; move it with x and z. -->
          <a-entity id="chair" position="0.62 0 1.61">
            <a-box position="0 0.56 0" width="0.42" height="0.04" depth="0.4" material="color: #b39a5e; roughness: 1"></a-box>
            <a-box position="-0.18 0.27 0.17"  width="0.04" height="0.54" depth="0.04" material="color: #5c3f24"></a-box>
            <a-box position="0.18 0.27 0.17"   width="0.04" height="0.54" depth="0.04" material="color: #5c3f24"></a-box>
            <a-box position="-0.18 0.47 -0.18" width="0.04" height="0.94" depth="0.04" material="color: #5c3f24"></a-box>
            <a-box position="0.18 0.47 -0.18"  width="0.04" height="0.94" depth="0.04" material="color: #5c3f24"></a-box>
            <a-box position="0 0.78 -0.18" width="0.36" height="0.05" depth="0.03" material="color: #5c3f24"></a-box>
            <a-box position="0 0.9 -0.18"  width="0.36" height="0.05" depth="0.03" material="color: #5c3f24"></a-box>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    // Writes depth but no colour: the camera image shows through, and anything behind it is hidden.
    AFRAME.registerComponent('occluder', {
      init() {
        const apply = () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;
          mesh.material = new THREE.MeshBasicMaterial({ colorWrite: false });
          mesh.renderOrder = -1;
        };
        apply();
        this.el.addEventListener('object3dset', apply);
      }
    });

    // The painting dissolves outward from the red door, with a warm burning edge.
    AFRAME.registerComponent('dissolve', {
      schema: { src: { type: 'string' }, progress: { default: 0 } },
      init() {
        const tex = new THREE.TextureLoader().load(this.data.src);
        this.material = new THREE.ShaderMaterial({
          uniforms: {
            map: { value: tex },
            progress: { value: 0 },
            door: { value: new THREE.Vector2(0.25, 0.385) }
          },
          vertexShader: `
            varying vec2 vUv;
            void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
          fragmentShader: `
            uniform sampler2D map; uniform float progress; uniform vec2 door; varying vec2 vUv;
            float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
            float noise(vec2 p) {
              vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
              return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
            }
            float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.0; a *= 0.5; } return v; }
            void main() {
              vec4 c = texture2D(map, vUv);
              vec2 aspect = vec2(1.0, 0.8226);
              float d = distance(vUv * aspect, door * aspect);
              float v = d * 0.9 + fbm(vUv * vec2(9.0, 7.4)) * 0.5;
              float t = progress * 1.45;
              if (v < t) discard;
              float edge = smoothstep(t + 0.06, t, v) * step(0.001, progress);
              gl_FragColor = vec4(mix(c.rgb, vec3(1.0, 0.62, 0.25), edge), 1.0);
            }`
        });
        const apply = () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;
          mesh.material = this.material;
          mesh.renderOrder = 1;
        };
        apply();
        this.el.addEventListener('object3dset', apply);
      },
      update() { this.material.uniforms.progress.value = this.data.progress; }
    });

    // Optional on-screen diagnostics: add ?debug=1 to the page address
    const DEBUG = new URLSearchParams(location.search).has('debug');
    const debugLines = {};
    function debug(key, value) {
      if (!DEBUG) return;
      debugLines[key] = value;
      let box = document.querySelector('#debug');
      if (!box) {
        box = document.createElement('pre');
        box.id = 'debug';
        box.style.cssText = 'position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;margin:0;padding:6px 8px;font:12px/1.4 monospace;background:rgba(0,0,0,0.7);color:#fff;white-space:pre-wrap';
        document.body.appendChild(box);
      }
      box.textContent = Object.entries(debugLines).map(([k, v]) => k + ': ' + v).join('\n');
    }
    let missingTracks = 0;
    const origWarn = console.warn;
    console.warn = function (...args) {
      if (String(args[0]).includes('No target node found')) { missingTracks++; debug('tracks not matched', missingTracks); }
      origWarn.apply(console, args);
    };

    // Fade a model in from transparent
    function fadeIn(el, ms = 1500) {
      el.setAttribute('visible', true);
      const mats = [];
      const obj = el.object3D;
      obj.traverse(o => { if (o.material) [].concat(o.material).forEach(m => { m.transparent = true; m.opacity = 0; mats.push(m); }); });
      const t0 = performance.now();
      const step = now => {
        const k = Math.min((now - t0) / ms, 1);
        mats.forEach(m => { m.opacity = k; if (k === 1) m.transparent = false; });
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    // The radio: tap to play music.mp3, preceded by a little static. Tap again to stop.
    const music = new Audio('./music.mp3');
    music.preload = 'none';   // only download the music when someone taps the radio
    function playStatic(seconds = 1.2) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const len = Math.floor(audioCtx.sampleRate * seconds);
        const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < 0.02 ? 1 : 0.25) * (1 - i / len);
        const src = audioCtx.createBufferSource(), filt = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
        filt.type = 'bandpass'; filt.frequency.value = 2200; g.gain.value = 0.35;
        src.buffer = buf; src.connect(filt).connect(g).connect(audioCtx.destination); src.start();
      } catch (e) {}
    }
    function stopRadio() {
      music.pause(); music.currentTime = 0;
      document.querySelector('#caption').classList.add('hidden');
      document.querySelector('#music-btn').textContent = 'Play music';
    }
    function toggleRadio() {
      const caption = document.querySelector('#caption');
      const btn = document.querySelector('#music-btn');
      if (!music.paused) { stopRadio(); return; }
      playStatic();
      // Start the music inside the tap itself (iPhones require this), muted under the static, then bring it in.
      music.muted = true;
      const p = music.play();
      btn.textContent = 'Stop music';
      Promise.resolve(p).then(() => {
        caption.classList.remove('hidden');
        setTimeout(() => { music.muted = false; }, 900);
      }).catch(() => {
        btn.textContent = 'Play music';
        caption.textContent = 'The music could not play. Check music.mp3 is on the site.';
        caption.classList.remove('hidden');
      });
    }
    AFRAME.registerComponent('radio-tap', {
      init() { this.el.addEventListener('tap', toggleRadio); }
    });

    // Gentle firelight flicker on a light
    AFRAME.registerComponent('flicker', {
      schema: { base: { default: 1.5 }, amount: { default: 0.3 } },
      tick(t) {
        const l = this.el.getObject3D('light');
        if (!l) return;
        const n = Math.sin(t * 0.011) * 0.5 + Math.sin(t * 0.023 + 1.3) * 0.3 + Math.sin(t * 0.047 + 2.1) * 0.2;
        l.intensity = this.data.base + n * this.data.amount;
      }
    });

    // Plays one named animation clip from a glTF, once, holding the last pose.
    // The animation runs on its own clock, so it keeps playing even if the AR library pauses the scene.
    AFRAME.registerComponent('play-clip', {
      schema: { clip: { default: '' } },
      init() {
        this.mixer = null; this.action = null; this.pending = false;
        this.clock = new THREE.Clock();
        const onLoaded = () => {
          const model = this.el.getObject3D('mesh');
          if (!model || this.mixer) return;
          model.traverse(o => { if (o.isMesh || o.isSkinnedMesh) o.frustumCulled = false; });
          const clips = model.animations || [];
          debug('clips in model', clips.length ? clips.map(c => c.name + ' (' + c.duration.toFixed(1) + 's)').join(', ') : 'none');
          if (!clips.length) return;
          const clip = THREE.AnimationClip.findByName(clips, this.data.clip) || clips[0];
          this.mixer = new THREE.AnimationMixer(model);
          this.action = this.mixer.clipAction(clip);
          this.action.setLoop(THREE.LoopOnce, 1);
          this.action.clampWhenFinished = true;
          this.mixer.addEventListener('finished', () => this.el.emit('clip-finished'));
          this.loop();
          if (this.pending) this.playClip();
        };
        this.el.addEventListener('model-loaded', onLoaded);
        if (this.el.getObject3D('mesh')) onLoaded();
      },
      loop() {
        const step = () => {
          const dt = Math.min(this.clock.getDelta(), 0.1);
          if (this.mixer) this.mixer.update(dt);
          if (this.action) debug('animation', (this.action.isRunning() ? 'playing ' : 'stopped ') + this.action.time.toFixed(2) + 's');
          this.raf = requestAnimationFrame(step);
        };
        this.raf = requestAnimationFrame(step);
      },
      // Named playClip/stopClip, not play/stop: A-Frame reserves play() for its own lifecycle
      // and silently ignores calls to it once the scene is running.
      playClip() {
        if (!this.action) { this.pending = true; debug('animation', 'waiting for model'); return; }
        this.pending = false;
        this.action.reset();
        this.action.play();
        this.mixer.update(0);
      },
      stopClip() { this.pending = false; if (this.action) this.action.stop(); },
      remove() { cancelAnimationFrame(this.raf); }
    });

    // A wooden knock, made with the Web Audio API (no sound file needed)
    let audioCtx = null;
    function playKnock() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        [0, 0.22, 0.44].forEach(t => {
          const o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(150, now + t);
          o.frequency.exponentialRampToValueAtTime(55, now + t + 0.12);
          g.gain.setValueAtTime(0.0001, now + t);
          g.gain.exponentialRampToValueAtTime(0.9, now + t + 0.004);
          g.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.16);
          o.connect(g).connect(audioCtx.destination);
          o.start(now + t); o.stop(now + t + 0.2);
        });
      } catch (e) { /* sound is optional */ }
    }

    // The sequence: painting found -> Knock appears -> tap -> painting dissolves -> she walks in and sits.
    // If the painting is out of view for more than 3 seconds, everything resets for the next visitor.
    AFRAME.registerComponent('story', {
      init() {
        this.skin = document.querySelector('#painting-skin');
        this.woman = document.querySelector('#grandmother');
        this.hint = document.querySelector('#hint');
        this.knock = document.querySelector('#knock');
        this.state = 'waiting';   // waiting -> ready -> open
        this.timers = [];
        this.lostTimer = null;

        this.el.addEventListener('targetFound', () => {
          clearTimeout(this.lostTimer);
          this.hint.classList.add('hidden');
          if (this.state === 'waiting') {
            this.state = 'ready';
            this.skin.setAttribute('visible', true);
          }
          if (this.state === 'ready') this.knock.classList.remove('hidden');
        });
        this.el.addEventListener('targetLost', () => {
          this.knock.classList.add('hidden');
          this.hint.classList.remove('hidden');
          clearTimeout(this.lostTimer);
          this.lostTimer = setTimeout(() => this.reset(), 3000);
        });
        this.knock.addEventListener('click', () => this.open());
        this.book = document.querySelector('#book');

      },
      open() {
        if (this.state !== 'ready') return;
        this.state = 'open';
        this.knock.classList.add('hidden');
        playKnock();
        this.timers.push(setTimeout(() => {
          this.skin.setAttribute('animation__dissolve', {
            property: 'dissolve.progress', from: 0, to: 1, dur: 3200, easing: 'easeInQuad'
          });
        }, 700));
        this.timers.push(setTimeout(() => {
          this.woman.setAttribute('visible', true);
          this.woman.components['play-clip'].playClip();
        }, 2600));
        // Book appears just after she has sat down (her animation is 8.3 s)
        this.timers.push(setTimeout(() => fadeIn(this.book), 2600 + 8300 + 600));
        // Music button appears once the room is open
        this.timers.push(setTimeout(() => document.querySelector('#music-btn').classList.remove('hidden'), 3500));
      },
      reset() {
        this.timers.forEach(clearTimeout); this.timers = [];
        this.state = 'waiting';
        this.knock.classList.add('hidden');
        this.skin.removeAttribute('animation__dissolve');
        this.skin.setAttribute('dissolve', 'progress', 0);
        this.skin.setAttribute('visible', false);
        this.woman.setAttribute('visible', false);
        this.woman.components['play-clip'].stopClip();
        this.book.setAttribute('visible', false);
        document.querySelector('#music-btn').classList.add('hidden');
        stopRadio();
      }
    });

    // Start screen
    const startBtn = document.querySelector('#start');
    const intro = document.querySelector('#intro');
    const hint = document.querySelector('#hint');
    const errorBox = document.querySelector('#error');
    const sceneEl = document.querySelector('a-scene');

    // Taps on 3D objects marked .clickable
    const tapRay = new THREE.Raycaster();
    function onCanvasTap(e) {
      const cam = sceneEl.camera;
      if (!cam) return;
      const r = sceneEl.canvas.getBoundingClientRect();
      const ndc = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      cam.updateMatrixWorld();
      cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert();
      tapRay.setFromCamera(ndc, cam);
      const targets = [...document.querySelectorAll('.clickable')].map(el => el.object3D);
      const hit = tapRay.intersectObjects(targets, true)[0];
      if (!hit) return;
      let o = hit.object;
      while (o && !(o.el && o.el.classList.contains('clickable'))) o = o.parent;
      if (o) o.el.emit('tap');
    }
    if (sceneEl.canvas) sceneEl.canvas.addEventListener('click', onCanvasTap);
    else sceneEl.addEventListener('render-target-loaded', () => sceneEl.canvas.addEventListener('click', onCanvasTap));

    document.querySelector('#music-btn').addEventListener('click', toggleRadio);


    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
      hint.classList.add('hidden');
    }

    sceneEl.addEventListener('arError', () => {
      showError('The camera could not start. Allow camera access for this site, then reload the page.');
    });

    // If targets.mind hasn't been added to the site yet, build it from painting-target.jpg
    // on the phone itself. This is slower (10-60 seconds), so add targets.mind for the conference.
    async function compileInBrowser() {
      const Compiler = window.MINDAR && window.MINDAR.IMAGE && window.MINDAR.IMAGE.Compiler;
      if (!Compiler) throw new Error('no compiler');
      const img = new Image();
      img.src = './painting-target.jpg';
      await img.decode();
      const compiler = new Compiler();
      await compiler.compileImageTargets([img], p => {
        startBtn.textContent = 'Preparing the painting… ' + Math.round(p) + '%';
      });
      const data = await compiler.exportData();
      return URL.createObjectURL(new Blob([data]));
    }

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      // Unlock audio on this tap so the knock can play later
      try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}

      let hasTargets = false;
      try {
        const check = await fetch('./targets.mind', { method: 'HEAD', cache: 'no-store' });
        hasTargets = check.ok;
      } catch (e) { hasTargets = false; }

      let compiledUrl = null;
      if (!hasTargets) {
        try {
          compiledUrl = await compileInBrowser();
        } catch (e) {
          startBtn.disabled = false;
          startBtn.textContent = 'Open camera';
          showError('The painting could not be prepared. Open compile.html on this site to make targets.mind, add it next to index.html, and deploy again.');
          return;
        }
      }
      const start = () => {
        const system = sceneEl.systems['mindar-image-system'];
        if (compiledUrl) system.imageTargetSrc = compiledUrl;
        document.documentElement.classList.add('ar-running');
        intro.classList.add('hidden');
        hint.classList.remove('hidden');
        system.start();
      };
      if (sceneEl.hasLoaded) start(); else sceneEl.addEventListener('loaded', start, { once: true });
    });
  </script>
</body>
</html>
